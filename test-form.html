<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Form Autofiller - Test Form Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #090d1a;
      --bg-card: rgba(17, 25, 45, 0.65);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(0, 242, 254, 0.5);
      
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      
      --primary: #00f2fe;
      --primary-glow: rgba(0, 242, 254, 0.3);
      --secondary: #4facfe;
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.25);
      --danger: #ef4444;
      
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-neon: 0 0 20px var(--primary-glow);
      --shadow-card: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      overflow-y: auto;
      position: relative;
    }

    /* Background Glow Blobs */
    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(150px);
      z-index: -1;
      opacity: 0.12;
      pointer-events: none;
    }

    .bg-glow-1 {
      background: radial-gradient(circle, var(--primary) 0%, var(--secondary) 100%);
      top: -100px;
      right: -100px;
    }

    .bg-glow-2 {
      background: radial-gradient(circle, #b15dff 0%, #ff52af 100%);
      bottom: -150px;
      left: -150px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      z-index: 1;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-card);
      padding: 40px;
      transition: var(--transition-smooth);
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .header {
      margin-bottom: 32px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group-full {
      grid-column: span 2;
    }

    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }
      .form-group-full {
        grid-column: span 1;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label.field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="date"],
    input[type="time"],
    select,
    textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      transition: var(--transition-smooth);
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: var(--shadow-neon);
      background: rgba(0, 0, 0, 0.35);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    select[multiple] {
      min-height: 100px;
    }

    /* Option styling in select */
    select option {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      padding: 8px;
    }

    /* Selection Groups (Radios & Checkboxes) */
    .selection-group {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 6px 0;
    }

    .checkbox-container,
    .radio-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-container input[type="checkbox"],
    .radio-container input[type="radio"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .selection-label {
      font-size: 14px;
      color: var(--text-primary);
    }

    /* Contenteditable Field */
    .rich-text-editor {
      min-height: 80px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
      transition: var(--transition-smooth);
    }

    .rich-text-editor:focus {
      border-color: var(--primary);
      box-shadow: var(--shadow-neon);
      background: rgba(0, 0, 0, 0.35);
    }

    /* Action Row */
    .actions-row {
      grid-column: span 2;
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    @media (max-width: 600px) {
      .actions-row {
        grid-column: span 1;
      }
    }

    .btn-submit {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #000;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
      transition: var(--transition-smooth);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Toast Notification */
    .success-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(16, 185, 129, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 20px;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10000;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .success-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-icon {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <!-- Background Glow Blobs -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="container">
    <div class="card">
      <div class="header">
        <h1>Form Autofilling Test Playground</h1>
        <p>A testing form containing all standard and complex form input configurations.</p>
      </div>

      <form id="playground-form">
        <!-- 1. Text Inputs -->
        <div class="form-group">
          <label class="field-label" for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full_name" placeholder="John Doe">
        </div>

        <div class="form-group">
          <label class="field-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label class="field-label" for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+1 (555) 019-2834">
        </div>

        <!-- 2. Select Single -->
        <div class="form-group">
          <label class="field-label" for="country">Country (Single Select)</label>
          <select id="country" name="country">
            <option value="">-- Choose Country --</option>
            <option value="us">United States</option>
            <option value="uk">United Kingdom</option>
            <option value="ca">Canada</option>
            <option value="id">Indonesia</option>
            <option value="sg">Singapore</option>
            <option value="jp">Japan</option>
          </select>
        </div>

        <!-- 3. Date and Time -->
        <div class="form-group">
          <label class="field-label" for="birth-date">Birth Date (Date Input)</label>
          <input type="date" id="birth-date" name="birth_date">
        </div>

        <div class="form-group">
          <label class="field-label" for="preferred-time">Preferred Time (Time Input)</label>
          <input type="time" id="preferred-time" name="preferred_time">
        </div>

        <!-- 4. Select Multiple -->
        <div class="form-group form-group-full">
          <label class="field-label" for="skills">Skills (Multi-Select)</label>
          <select id="skills" name="skills" multiple>
            <option value="html">HTML5</option>
            <option value="css">CSS3</option>
            <option value="js">JavaScript</option>
            <option value="react">React</option>
            <option value="node">Node.js</option>
            <option value="python">Python</option>
            <option value="sql">SQL Databases</option>
          </select>
        </div>

        <!-- 5. Radio Buttons -->
        <div class="form-group form-group-full">
          <label class="field-label">Gender (Radio Group)</label>
          <div class="selection-group">
            <label class="radio-container">
              <input type="radio" id="gender-male" name="gender" value="male">
              <span class="selection-label">Male</span>
            </label>
            <label class="radio-container">
              <input type="radio" id="gender-female" name="gender" value="female">
              <span class="selection-label">Female</span>
            </label>
            <label class="radio-container">
              <input type="radio" id="gender-other" name="gender" value="other">
              <span class="selection-label">Other</span>
            </label>
          </div>
        </div>

        <!-- 6. Checkbox Group -->
        <div class="form-group form-group-full">
          <label class="field-label">Interests (Checkbox Group)</label>
          <div class="selection-group" id="interests-checkboxes">
            <label class="checkbox-container">
              <input type="checkbox" name="interests" value="coding">
              <span class="selection-label">Coding</span>
            </label>
            <label class="checkbox-container">
              <input type="checkbox" name="interests" value="music">
              <span class="selection-label">Music</span>
            </label>
            <label class="checkbox-container">
              <input type="checkbox" name="interests" value="sports">
              <span class="selection-label">Sports</span>
            </label>
            <label class="checkbox-container">
              <input type="checkbox" name="interests" value="art">
              <span class="selection-label">Art</span>
            </label>
          </div>
        </div>

        <!-- 7. Textarea -->
        <div class="form-group form-group-full">
          <label class="field-label" for="address">Full Address</label>
          <textarea id="address" name="address" placeholder="123 Science Dr, Tech City"></textarea>
        </div>

        <!-- 8. Contenteditable Rich Text -->
        <div class="form-group form-group-full">
          <label class="field-label" for="notes-editor">Additional Notes (Contenteditable)</label>
          <div id="notes-editor" class="rich-text-editor" contenteditable="true" placeholder="Type notes here..."></div>
        </div>

        <!-- 9. Single Checkbox -->
        <div class="form-group form-group-full">
          <label class="checkbox-container">
            <input type="checkbox" id="agree-terms" name="agree_terms" value="agree">
            <span class="selection-label" style="font-weight: 500;">I agree to the terms and conditions</span>
          </label>
        </div>

        <!-- Submit Button -->
        <div class="actions-row">
          <button type="submit" class="btn-submit" id="submit-btn">Submit Form ⚡</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Element -->
  <div id="toast" class="success-toast">
    <span class="toast-icon">🚀</span>
    <span class="toast-text">Form submitted successfully!</span>
  </div>

  <script>
    // Handle form submission toast
    document.getElementById('playground-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 4000);
    });
  </script>
</body>
</html>
